<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reel List — Movie Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase client library (database + authentication) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="marquee">
    <h1>Reel List</h1>
    <div id="user-bar" class="user-bar" hidden>
      <span id="user-email"></span>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main>
    <!-- ===== Auth view: register / log in ===== -->
    <section id="auth-view" class="auth" hidden>
      <h2 id="auth-title">Log in to your watchlist</h2>
      <form id="auth-form" class="stack">
        <label>Email
          <input type="email" id="auth-email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" />
        </label>
        <button type="submit" id="auth-submit" class="btn btn-gold">Log in</button>
      </form>
      <p class="switch">
        <span id="auth-switch-text">No account yet?</span>
        <button id="auth-switch" class="link">Create one</button>
      </p>
      <p id="auth-message" class="message" role="alert"></p>
    </section>

    <!-- ===== App view: the watchlist (CRUD) ===== -->
    <section id="app-view" hidden>
      <form id="add-form" class="add-form">
        <input id="add-title" placeholder="Movie title" required />
        <input id="add-year" type="number" placeholder="Year" min="1880" max="2100" />
        <input id="add-genre" placeholder="Genre" />
        <button type="submit" class="btn btn-gold">Add movie</button>
      </form>

      <div class="filters" role="group" aria-label="Filter movies">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="towatch">To watch</button>
        <button class="filter" data-filter="watched">Watched</button>
        <span id="count" class="count"></span>
      </div>

      <div class="tools">
        <input id="search" type="search" placeholder="Search by title or genre" aria-label="Search movies" />
        <select id="sort" aria-label="Sort movies">
          <option value="newest">Newest added</option>
          <option value="title">Title A–Z</option>
          <option value="year">Year (newest first)</option>
          <option value="rating">Highest rated</option>
        </select>
      </div>

      <p id="app-message" class="message" role="alert"></p>
      <ul id="movie-list" class="movie-list"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet. Add a movie you want to see.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
